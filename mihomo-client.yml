#
# Core settings
#
log-level: warning
ipv6: false
udp: true
mixed-port: 2080
unified-delay: true
disable-keep-alive: false
keep-alive-interval: 30
keep-alive-idle: 30
find-process-mode: strict
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true


#
# TUN settings
#
tun:
  stack: gvisor
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  mtu: 1500
  dns-hijack:
    - any:53
    - tcp://any:53


#
# NTP settings
#
ntp:
  enable: true
  server: time.cloudflare.com
  port: 123
  interval: 30


#
# SNIFFING settings
#
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]


#
# DNS settings
# fake-ip + real-ip for RU
#
dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:53
  respect-rules: false
  ipv6: false

  default-nameserver:
    - 1.1.1.1
    - 9.9.9.9
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - tls://1.1.1.1
    - https://dns.quad9.net/dns-query
    - tls://dns.quad9.net

  nameserver-policy:
    "rule-set:geosite-category-ru,geosite-tld-ru,geosite-gov-ru,geosite-bank-ru,geosite-yandex,geosite-itdoginfo-allow-domains-outside":
    - https://common.dot.dns.yandex.net/dns-query
    - tls://77.88.8.8
    - 77.88.8.8

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - DOMAIN,localhost,real-ip
    - DOMAIN-KEYWORD,stun,real-ip
    - DOMAIN-KEYWORD,turn,real-ip

    - RULE-SET,geosite-category-ru,real-ip
    - RULE-SET,geosite-tld-ru,real-ip
    - RULE-SET,geosite-gov-ru,real-ip
    - RULE-SET,geosite-bank-ru,real-ip
    - RULE-SET,geosite-yandex,real-ip
    - RULE-SET,geosite-itdoginfo-allow-domains-outside,real-ip

    - MATCH,fake-ip


#
# PROXIES settings
#
proxies:

  - name: VLESS
    dialer-proxy: GATEWAY-PROXY
    type: vless
    network: tcp
    server:
    port: 443
    udp: true
    uuid:
    flow: xtls-rprx-vision
    packet-encoding: xudp
    tls: true
    servername:
    client-fingerprint: chrome
    reality-opts:
      public-key:


#
# PROXY PROVIDERS settings
# x-proxy-providers-defaults - common fields
# x-proxy-providers-override - additional common fields
#
x-proxy-providers-defaults: &pp-defaults
  type: http
  interval: 86400
  proxy: DIRECT
  exclude-type: ss|vmess

x-proxy-providers-override:
  udp-and-dialer: &ppo-1
    override:
      dialer-proxy: GATEWAY-PROXY
      udp: true

  udp-only: &ppo-2
    override:
      udp: true

proxy-providers:

  # source: https://github.com/sakha1370/OpenRay
  regular-openray:
    <<: [ *pp-defaults, *ppo-1 ]
    url: https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/kind/trojan.txt
    path: ./providers/regular-openray.txt

  # source: https://etoneyaproject.github.io
  regular-etoneya:
    <<: [ *pp-defaults, *ppo-1 ]
    url: https://raw.githubusercontent.com/EtoNeYaProject/etoneyaproject.github.io/refs/heads/main/youtube
    path: ./providers/regular-etoneya.txt

  # ---

  # source: https://github.com/igareck/vpn-configs-for-russia
  whitelist-cidr-georu:
    <<: [ *pp-defaults, *ppo-2 ]
    url: https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt
    path: ./providers/whitelist-cidr-georu.txt
    filter: Russia


#
# PROXY GROUPS settings
# x-proxy-groups-defaults - common fields
# PROXY selector goes through GATEWAY-PROXY selector
# GATEWAY-RU selector(default - DIRECT) routes RU
#
x-proxy-groups-defaults: &pg-defaults
  url: http://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 30
  timeout: 5000
  lazy: false

proxy-groups:

  - name: PROXY
    <<: [ *pg-defaults ]
    type: select
    proxies:
      - VLESS
      - REGULAR-OPENRAY
      - REGULAR-ETONEYA
      - REJECT

  - name: GATEWAY-PROXY
    <<: [ *pg-defaults ]
    type: select
    proxies:
      - DIRECT
      - WHITELIST-CIDR-GEORU
      - REJECT

  - name: GATEWAY-RU
    <<: [ *pg-defaults ]
    type: select
    proxies:
      - DIRECT
      - WHITELIST-CIDR-GEORU
      - REJECT

  # ---

  # do not apply *pg-defaults to avoid a large amount of pings
  - name: REGULAR-OPENRAY
    type: select
    proxies:
      - REJECT
    use:
      - regular-openray

  # do not apply *pg-defaults to avoid a large amount of pings
  - name: REGULAR-ETONEYA
    type: select
    proxies:
      - REJECT
    use:
      - regular-etoneya

  # ---

  # do not apply *pg-defaults to avoid a large amount of pings
  - name: WHITELIST-CIDR-GEORU
    type: select
    proxies:
      - REJECT
    use:
      - whitelist-cidr-georu


#
# RULE PROVIDERS settings
# x-rule-providers-defaults - common fields
# rulesets for private ranges and RU
#
x-rule-providers-defaults: &rp-defaults
  type: http
  interval: 86400

rule-providers:

  # source: https://github.com/MetaCubeX/meta-rules-dat/tree/meta
  geoip-private:
    <<: [ *rp-defaults ]
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs
    path: ./rules/geoip-private.mrs
    format: mrs
    behavior: ipcidr

  # source: https://github.com/MetaCubeX/meta-rules-dat/tree/meta
  geoip-ru:
    <<: [ *rp-defaults ]
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/ru.mrs
    path: ./rules/geoip-ru.mrs
    format: mrs
    behavior: ipcidr

  # ---

  # source: https://github.com/MetaCubeX/meta-rules-dat/tree/meta
  geosite-category-ru:
    <<: [ *rp-defaults ]
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-ru.mrs
    path: ./rules/geosite-category-ru.mrs
    format: mrs
    behavior: domain

  # source: https://github.com/MetaCubeX/meta-rules-dat/tree/meta
  geosite-tld-ru:
    <<: [ *rp-defaults ]
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/tld-ru.mrs
    path: ./rules/geosite-tld-ru.mrs
    format: mrs
    behavior: domain

  # source: https://github.com/MetaCubeX/meta-rules-dat/tree/meta
  geosite-gov-ru:
    <<: [ *rp-defaults ]
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-gov-ru.mrs
    path: ./rules/geosite-gov-ru.mrs
    format: mrs
    behavior: domain

  # source: https://github.com/MetaCubeX/meta-rules-dat/tree/meta
  geosite-bank-ru:
    <<: [ *rp-defaults ]
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-bank-ru.mrs
    path: ./rules/geosite-bank-ru.mrs
    format: mrs
    behavior: domain

  # source: https://github.com/MetaCubeX/meta-rules-dat/tree/meta
  geosite-yandex:
    <<: [ *rp-defaults ]
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/yandex.mrs
    path: ./rules/geosite-yandex.mrs
    format: mrs
    behavior: domain

  # source: https://github.com/itdoginfo/allow-domains/
  geosite-itdoginfo-allow-domains-outside:
    <<: [ *rp-defaults ]
    url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/outside-clashx.lst
    path: ./rules/geosite-itdoginfo-allow-domains-outside.lst
    format: text
    behavior: classical


#
# RULES settings
# IPv6 through REJECT
# RU through GATEWAY-RU(default - DIRECT)
# REST through PROXY
#
rules:
  - IP-CIDR6,::/0,REJECT
  - RULE-SET,geoip-private,DIRECT,no-resolve

  - RULE-SET,geosite-category-ru,GATEWAY-RU
  - RULE-SET,geosite-tld-ru,GATEWAY-RU
  - RULE-SET,geosite-gov-ru,GATEWAY-RU
  - RULE-SET,geosite-bank-ru,GATEWAY-RU
  - RULE-SET,geosite-yandex,GATEWAY-RU
  - RULE-SET,geosite-itdoginfo-allow-domains-outside,GATEWAY-RU
  - RULE-SET,geoip-ru,GATEWAY-RU,no-resolve

  - MATCH,PROXY
