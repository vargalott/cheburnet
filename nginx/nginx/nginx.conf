user                        nginx;
worker_processes            auto;

error_log                   /dev/stdout warn;
pid                         /var/run/nginx.pid;

events {
    worker_connections      512;
}

http {
    types                   { text/yaml yaml yml; }
    default_type            application/octet-stream;

    log_format main         "[$time_local] {$remote_addr} '$http_referer' '$http_user_agent'";
    access_log              /dev/stdout main;

    sendfile                on;
    tcp_nopush              on;
    tcp_nodelay             on;

    keepalive_timeout       60;
    client_body_timeout     15;
    client_header_timeout   15;
    send_timeout            10;

    gzip                    on;
    gzip_types              text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server_tokens           off;

    resolver                1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout        5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # dummy listener for non-domain requests
    # https only
    server {
        listen          443 ssl default_server; # proxy_protocol
        server_name     _;

        # set_real_ip_from        172.20.0.0/24;
        # real_ip_header          proxy_protocol;

        ssl_certificate         /etc/nginx/dummy.crt;
        ssl_certificate_key     /etc/nginx/dummy.key;

        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        return 301 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
    }

    # upsrteam listener for vaultwarden
    upstream vaultwarden-upstream {
        zone vaultwarden-upstream   64k;
        server                      172.20.0.40; # http://vaultwarden
        keepalive                   2;
    }

    # main listener
    # https only
    server {
        listen              443 ssl; # proxy_protocol
        http2               on;

        # set_real_ip_from    172.20.0.0/24;
        # real_ip_header      proxy_protocol;

        server_name     DOMAIN;
        server_tokens   off;

        # Headers
        # add_header Content-Security-Policy      "default-src 'self'" always;
        add_header Permissions-Policy           "interest-cohort=() browsing-topics=()" always;
        add_header Referrer-Policy              "same-origin" always;
        add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options       "nosniff" always;
        add_header X-Frame-Options              "sameorigin" always;
        add_header X-XSS-Protection             "1; mode=block" always;
        proxy_hide_header                       "X-Powered-By";

        # SSL
        ssl_protocols               TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers   on;
        ssl_session_cache           shared:SSL:10m;
        ssl_session_tickets         off;
        ssl_session_timeout         30m;
        ssl_stapling                on;
        ssl_stapling_verify         on;
        ssl_ciphers                 "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305";

        # Certificates
        ssl_certificate             /etc/letsencrypt/live/DOMAIN/fullchain.pem;
        ssl_certificate_key         /etc/letsencrypt/live/DOMAIN/privkey.pem;
        ssl_trusted_certificate     /etc/letsencrypt/live/DOMAIN/chain.pem;

        root                        /data;

        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # glance
        location / {
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_pass          http://172.20.0.30:4001/; # http://glance
        }

        # proxy subscriptions
        location /sub {
            try_files           $uri $uri/ =403;
        }

        # vaultwarden
        location /vault/ {
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_pass          http://vaultwarden-upstream/;
        }
    }
}
