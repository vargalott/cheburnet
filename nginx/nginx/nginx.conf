user                        nginx;
worker_processes            auto;

error_log                   /dev/stdout warn;
# error_log                   /etc/nginx/logs/error.log warn;
pid                         /var/run/nginx.pid;

events {
    worker_connections      512;
}

http {
    types                   { text/yaml yaml yml; }
    default_type            application/octet-stream;

    log_format              main "[$time_local]\n\tclient:\t\t$proxy_protocol_addr:$proxy_protocol_port ($remote_addr:$remote_port)\n\tuser:\t\t$remote_user\n\trequest:\t$request\n\treferer:\t$http_referer\n\tuser agent:\t$http_user_agent\n\tstatus:\t\t$status";
    access_log              /dev/stdout main;
    # access_log              /etc/nginx/logs/access.log main;

    sendfile                on;
    tcp_nopush              on;
    tcp_nodelay             on;

    keepalive_timeout       60;
    client_body_timeout     15;
    client_header_timeout   15;
    send_timeout            10;

    gzip                    on;
    gzip_types              text/plain text/css text/javascript application/json application/javascript application/wasm font/woff2;

    server_tokens           off;

    resolver                1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout        5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' "";
    }

    # dummy listener for non-domain requests
    # https only
    server {
        listen                  443 ssl default_server proxy_protocol;
        server_name             _;
        ssl_reject_handshake    on;

        set_real_ip_from        172.20.0.0/24;
        return                  444;
    }

    # main listener
    # https only
    server {
        listen              443 ssl proxy_protocol;
        http2               on;

        set_real_ip_from    172.20.0.0/24;

        server_name         DOMAIN;
        server_tokens       off;

        # SSL
        ssl_protocols               TLSv1.3;
        ssl_session_cache           shared:SSL:10m;
        ssl_session_tickets         off;
        ssl_session_timeout         30m;

        # certificates
        ssl_certificate             /etc/letsencrypt/live/DOMAIN/fullchain.pem;
        ssl_certificate_key         /etc/letsencrypt/live/DOMAIN/privkey.pem;
        ssl_trusted_certificate     /etc/letsencrypt/live/DOMAIN/chain.pem;

        root                        /data;

        # hug the robots
        location = /robots.txt {
            default_type        text/plain;
            return 200          "User-agent: *\nDisallow: /\n";
        }

        # default masquerade target for VLESS-REALITY | Hysteria 2
        # can be any actually any service e.g. /glance/ - just on /
        location / {
            default_type        text/html;
            index               index.html;
        }

        # proxy subscriptions
        # replace sub with
        # tr -dc 'A-Za-z0-9' </dev/urandom | head -c 64; echo
        location /sub/ {
            default_type                            text/plain;
            add_header Referrer-Policy              "same-origin" always;
            add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options       "nosniff" always;
            add_header X-Frame-Options              "sameorigin" always;

            try_files           $uri $uri/ =403;
        }

        # glance
        location /glance/ {
            add_header Referrer-Policy              "same-origin" always;
            add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options       "nosniff" always;
            add_header X-Frame-Options              "sameorigin" always;
            proxy_hide_header                       X-Powered-By;

            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $proxy_protocol_addr;
            proxy_set_header    X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_pass          http://172.20.0.30:4001/; # http://glance
        }

        # vaultwarden
        # all headers are managed by vaultwarden itself
        location /vault/ {
            proxy_hide_header   X-Powered-By;

            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $proxy_protocol_addr;
            proxy_set_header    X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_pass          http://vaultwarden-upstream;
        }
    }

    # upstream listener for vaultwarden
    upstream vaultwarden-upstream {
        zone vaultwarden-upstream   64k;
        server                      172.20.0.40; # http://vaultwarden
        keepalive                   2;
    }
}
