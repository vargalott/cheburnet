upstream vaultwarden-upstream {
    zone vaultwarden-upstream   64k;
    server                      172.20.0.40; # http://vaultwarden
    keepalive                   2;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen          443 ssl;
    http2           on;

    server_name     DOMAIN;
    server_tokens   off;

    # Headers
    # add_header Content-Security-Policy      "default-src 'self'" always;
    add_header Permissions-Policy           "interest-cohort=() browsing-topics=()" always;
    add_header Referrer-Policy              "same-origin" always;
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header X-Frame-Options              "sameorigin";
    add_header X-XSS-Protection             "1; mode=block" always;
    proxy_hide_header                       "X-Powered-By";

    # SSL
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   on;
    ssl_session_cache           shared:SSL:10m;
    ssl_session_tickets         off;
    ssl_session_timeout         30m;
    ssl_stapling                on;
    ssl_stapling_verify         on;
    ssl_ciphers                 "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305";

    # Certificates
    ssl_certificate             /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key         /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_trusted_certificate     /etc/letsencrypt/live/DOMAIN/chain.pem;

    root                        /data;
    access_log                  /etc/nginx/logs/server.access.log combined;
    error_log                   /etc/nginx/logs/server.error.log warn;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # proxy subs
    location /BLAHBLAHBLAH {
        try_files $uri $uri/ =403;
    }

    # glance
    location / {
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_pass          http://glance:4001/;
        # rewrite             ^/SERVICE(/.*)$ $1 break;
    }

    # vaultwarden
    location /vault/ {
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_pass          http://vaultwarden-upstream/;
    }
}
