<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050404" />
    <title>Harbor</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #040303;
        overflow: hidden;
      }
      body {
        color: #e9dccd;
        -webkit-font-smoothing: antialiased;
        animation: fadein 2.8s ease both;
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      #waves {
        position: fixed;
        left: -24px;
        top: -24px;
        width: calc(100% + 48px);
        height: calc(100% + 48px);
        z-index: 1;
        filter: blur(1.8px) saturate(0.92);
        transition: opacity 2.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #cryptic {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
        transition: opacity 1.4s ease;
      }
      .msg {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        color: rgba(226, 204, 182, 0.9);
        line-height: 1.38;
        overflow-wrap: break-word;
        text-shadow: 0 0 14px rgba(200, 110, 60, 0.2);
        will-change: opacity, filter;
      }
      .mi,
      .mj {
        display: block;
      }
      #veil {
        position: fixed;
        inset: 0;
        z-index: 3;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 2.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #center {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      #stack {
        position: relative;
      }
      #titleFloat {
        animation: drift 12s ease-in-out infinite;
        filter: drop-shadow(0 0 26px rgba(214, 124, 70, 0.17));
        transition: filter 2.4s ease;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(0, -7px, 0);
        }
      }
      #title {
        margin: 0;
        font-weight: 300;
        font-size: clamp(44px, 10.5vw, 148px);
        line-height: 1.05;
        white-space: nowrap;
        text-transform: uppercase;
        font-family:
          "Optima", "Candara", "Gill Sans", "Gill Sans MT", "Trebuchet MS",
          "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: rgba(236, 222, 206, 0.92);
        transition: color 2.4s ease;
        transform-origin: 50% 50%;
        --c1: 170, 48, 38;
        --c2: 222, 160, 96;
        text-shadow:
          var(--gx, 0px) 0 0 rgba(var(--c1), var(--ga, 0)),
          calc(var(--gx, 0px) * -1) 0 0 rgba(var(--c2), var(--ga2, 0));
      }
      .l {
        display: inline-block;
        margin: 0 0.11em;
        text-align: center;
        will-change: transform;
      }
      .l.gl {
        color: #f6dcc2;
      }

      #loader {
        position: absolute;
        top: 100%;
        left: 50%;
        width: min(52vw, 380px);
        margin-top: clamp(20px, 3.4vh, 36px);
        transform: translateX(-50%);
        transition: opacity 1.2s ease;
      }
      #bar {
        position: relative;
        height: 2px;
        background: rgba(233, 220, 205, 0.09);
        border-radius: 2px;
      }
      #fill {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        border-radius: 2px;
        transform-origin: left center;
        transform: scaleX(0);
        background: linear-gradient(
          90deg,
          rgba(150, 70, 40, 0),
          rgba(214, 140, 86, 0.85)
        );
        box-shadow: 0 0 14px rgba(214, 120, 70, 0.35);
        transition:
          background 0.35s ease,
          box-shadow 0.35s ease;
      }
      #row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        margin-top: 12px;
        font:
          11px/1.55 ui-monospace,
          Menlo,
          Consolas,
          "DejaVu Sans Mono",
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(233, 220, 205, 0.38);
        transition: color 0.35s ease;
      }
      #msg {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      #pct {
        font-variant-numeric: tabular-nums;
        min-width: 4ch;
        text-align: right;
      }
      #loader.err #fill {
        background: linear-gradient(
          90deg,
          rgba(90, 18, 18, 0),
          rgba(150, 38, 34, 0.92)
        );
        box-shadow: 0 0 16px rgba(150, 30, 28, 0.5);
      }
      #loader.err #row {
        color: rgba(166, 52, 46, 0.88);
      }

      #vignette {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        transition: opacity 2.4s ease;
        background: radial-gradient(
          ellipse at 50% 46%,
          rgba(0, 0, 0, 0) 32%,
          rgba(0, 0, 0, 0.58) 100%
        );
      }
      .grain {
        position: fixed;
        inset: -320px;
        pointer-events: none;
        will-change: transform, opacity;
        transition: opacity 2.4s ease;
      }
      #grain {
        z-index: 6;
        background-size: 256px 256px;
        opacity: 0.12;
      }
      #grain2 {
        z-index: 7;
        background-size: 320px 320px;
        opacity: 0;
      }
      #redpulse {
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          ellipse at 50% 55%,
          rgba(120, 24, 22, 0.17),
          rgba(60, 10, 10, 0.1) 45%,
          rgba(0, 0, 0, 0) 76%
        );
      }

      #snd {
        position: fixed;
        left: 50%;
        bottom: calc(18px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid rgba(233, 220, 205, 0.07);
        background: transparent;
        color: rgba(233, 220, 205, 0.6);
        opacity: 0.13;
        cursor: pointer;
        z-index: 10;
        transition:
          opacity 0.5s ease,
          border-color 0.5s ease,
          background 0.5s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #snd:hover,
      #snd:focus-visible {
        opacity: 0.6;
        border-color: rgba(233, 220, 205, 0.18);
        outline: none;
      }
      #snd.on {
        opacity: 0.3;
      }
      #snd.on:hover {
        opacity: 0.7;
      }
      #snd svg {
        display: block;
      }
      #snd rect {
        transform-box: fill-box;
        transform-origin: center;
        transform: scaleY(0.14);
        transition: transform 0.6s ease;
      }
      #snd.on rect {
        animation: eq 2.2s ease-in-out infinite;
      }
      #snd.on rect:nth-child(2) {
        animation-delay: -0.5s;
        animation-duration: 1.8s;
      }
      #snd.on rect:nth-child(3) {
        animation-delay: -1.1s;
        animation-duration: 2.6s;
      }
      #snd.on rect:nth-child(4) {
        animation-delay: -0.3s;
        animation-duration: 2s;
      }
      #snd.on rect:nth-child(5) {
        animation-delay: -1.5s;
        animation-duration: 2.4s;
      }
      @keyframes eq {
        0%,
        100% {
          transform: scaleY(0.25);
        }
        50% {
          transform: scaleY(1);
        }
      }

      html.void #waves {
        opacity: 0;
      }
      html.void #cryptic {
        opacity: 0;
      }
      html.void #veil {
        opacity: 1;
      }
      html.void #vignette {
        opacity: 0;
      }
      html.void #loader {
        opacity: 0;
      }
      html.void #grain {
        opacity: 0.46;
      }
      html.void #grain2 {
        opacity: 0.34;
      }
      html.void #title {
        color: #fff;
        --c1: 255, 255, 255;
        --c2: 255, 255, 255;
      }
      html.void #titleFloat {
        filter: drop-shadow(0 0 0 rgba(214, 124, 70, 0));
      }
      html.void .l.gl {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="waves" aria-hidden="true"></canvas>
    <div id="cryptic" aria-hidden="true"></div>
    <div id="veil"></div>
    <main id="center">
      <div id="stack">
        <div id="titleFloat"><h1 id="title" aria-label="Harbor"></h1></div>
        <div id="loader" aria-hidden="true">
          <div id="bar"><i id="fill"></i></div>
          <div id="row"><span id="msg"></span><span id="pct">0%</span></div>
        </div>
      </div>
    </main>
    <div id="vignette"></div>
    <div class="grain" id="grain"></div>
    <div class="grain" id="grain2"></div>
    <div id="redpulse"></div>
    <button
      id="snd"
      type="button"
      aria-label="Toggle sound"
      aria-pressed="false"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <rect x="2.2" y="4" width="1.6" height="12" rx=".8" />
        <rect x="6.1" y="4" width="1.6" height="12" rx=".8" />
        <rect x="10" y="4" width="1.6" height="12" rx=".8" />
        <rect x="13.9" y="4" width="1.6" height="12" rx=".8" />
        <rect
          x="17.8"
          y="4"
          width="1.6"
          height="12"
          rx=".8"
          style="display: none"
        />
      </svg>
    </button>

    <script>
      /* ================= DATA ================= */
      const HD = (() => {
        const LANGS = [];
        const RTL = new Set(["he", "ar", "fa", "ur", "yi", "ps"]);
        const L = (c, h, t, s) =>
          LANGS.push({
            c,
            rtl: RTL.has(c),
            h: h.split("|"),
            t: t.split("|"),
            s,
          });
        L(
          "en",
          "The tide remembers what the shore forgot|Someone is counting the harbor lights|Every wave carries a name that is not yours|The signal arrived before it was sent",
          "do not answer when the water speaks|the deep is not empty, it listens|the last ship has not yet left",
          "Silence has a pulse here",
        );
        L(
          "ru",
          "Прилив помнит то, что берег забыл|Кто-то считает огни гавани|Каждая волна несёт имя, которое не твоё|Сигнал пришёл раньше, чем был отправлен",
          "не отвечай, когда говорит вода|глубина не пуста — она слушает|последний корабль ещё не ушёл",
          "У тишины здесь есть пульс",
        );
        L(
          "uk",
          "Приплив пам’ятає те, що берег забув|Хтось рахує вогні гавані|Кожна хвиля несе ім’я, що не твоє|Сигнал прийшов раніше, ніж його надіслали",
          "не відповідай, коли говорить вода|глибина не порожня — вона слухає|останній корабель ще не відплив",
          "У тиші тут є пульс",
        );
        L(
          "be",
          "Прылiў памятае тое, што бераг забыў|Нехта лічыць агні гавані|Кожная хваля нясе імя, якое не тваё|Сігнал прыйшоў раней, чым яго адправілі",
          "не адказвай, калі гаворыць вада|глыбіня не пустая — яна слухае|апошні карабель яшчэ не адплыў",
          "У цішыні тут ёсць пульс",
        );
        L(
          "pl",
          "Przypływ pamięta to, co brzeg zapomniał|Ktoś liczy światła portu|Każda fala niesie imię, które nie jest twoje|Sygnał dotarł, zanim został wysłany",
          "nie odpowiadaj, gdy przemawia woda|głębia nie jest pusta — ona słucha|ostatni statek jeszcze nie odpłynął",
          "Cisza ma tu puls",
        );
        L(
          "cs",
          "Příliv si pamatuje, co břeh zapomněl|Někdo počítá světla přístavu|Každá vlna nese jméno, které není tvé|Signál dorazil dřív, než byl odeslán",
          "neodpovídej, když mluví voda|hlubina není prázdná — naslouchá|poslední loď ještě neodplula",
          "Ticho tu má puls",
        );
        L(
          "sk",
          "Príliv si pamätá, čo breh zabudol|Niekto počíta svetlá prístavu|Každá vlna nesie meno, ktoré nie je tvoje|Signál dorazil skôr, než bol odoslaný",
          "neodpovedaj, keď hovorí voda|hlbina nie je prázdna — počúva|posledná loď ešte neodplávala",
          "Ticho tu má tep",
        );
        L(
          "sl",
          "Plima se spominja, kar je obala pozabila|Nekdo šteje luči pristanišča|Vsak val nosi ime, ki ni tvoje|Signal je prispel, preden je bil poslan",
          "ne odgovarjaj, ko govori voda|globina ni prazna — posluša|zadnja ladja še ni odplula",
          "Tišina ima tu utrip",
        );
        L(
          "hr",
          "Plima pamti ono što je obala zaboravila|Netko broji svjetla luke|Svaki val nosi ime koje nije tvoje|Signal je stigao prije nego što je poslan",
          "ne odgovaraj kad voda govori|dubina nije prazna — ona sluša|posljednji brod još nije otplovio",
          "Tišina ovdje ima puls",
        );
        L(
          "sr",
          "Плима памти оно што је обала заборавила|Неко броји светла луке|Сваки талас носи име које није твоје|Сигнал је стигао пре него што је послат",
          "не одговарај кад вода говори|дубина није празна — она слуша|последњи брод још није испловио",
          "Тишина овде има пулс",
        );
        L(
          "bg",
          "Приливът помни онова, което брегът забрави|Някой брои светлините на пристанището|Всяка вълна носи име, което не е твое|Сигналът пристигна, преди да бъде изпратен",
          "не отговаряй, когато водата говори|дълбочината не е празна — тя слуша|последният кораб още не е отплавал",
          "Тишината тук има пулс",
        );
        L(
          "mk",
          "Плимата памети што брегот го заборави|Некој ги брои светлата на пристаништето|Секој бран носи име што не е твое|Сигналот пристигна пред да биде испратен",
          "не одговарај кога зборува водата|длабочината не е празна — таа слуша|последниот брод сè уште не заминал",
          "Тишината тука има пулс",
        );
        L(
          "de",
          "Die Flut erinnert sich, was das Ufer vergaß|Jemand zählt die Lichter des Hafens|Jede Welle trägt einen Namen, der nicht deiner ist|Das Signal kam an, bevor es gesendet wurde",
          "antworte nicht, wenn das Wasser spricht|die Tiefe ist nicht leer — sie hört zu|das letzte Schiff ist noch nicht ausgelaufen",
          "Die Stille hat hier einen Puls",
        );
        L(
          "nl",
          "Het getij herinnert zich wat de kust vergat|Iemand telt de lichten van de haven|Elke golf draagt een naam die niet de jouwe is|Het signaal kwam aan voordat het werd verzonden",
          "antwoord niet wanneer het water spreekt|de diepte is niet leeg — ze luistert|het laatste schip is nog niet vertrokken",
          "De stilte heeft hier een hartslag",
        );
        L(
          "sv",
          "Tidvattnet minns vad stranden glömde|Någon räknar hamnens ljus|Varje våg bär ett namn som inte är ditt|Signalen anlände innan den skickades",
          "svara inte när vattnet talar|djupet är inte tomt — det lyssnar|det sista skeppet har ännu inte lämnat",
          "Tystnaden har puls här",
        );
        L(
          "no",
          "Tidevannet husker det stranden glemte|Noen teller lysene i havnen|Hver bølge bærer et navn som ikke er ditt|Signalet kom før det ble sendt",
          "ikke svar når vannet snakker|dypet er ikke tomt — det lytter|det siste skipet har ennå ikke forlatt havnen",
          "Stillheten har puls her",
        );
        L(
          "da",
          "Tidevandet husker, hvad stranden glemte|Nogen tæller havnens lys|Hver bølge bærer et navn, der ikke er dit|Signalet ankom, før det blev sendt",
          "svar ikke, når vandet taler|dybet er ikke tomt — det lytter|det sidste skib er endnu ikke sejlet",
          "Stilheden har puls her",
        );
        L(
          "is",
          "Flóðið man það sem ströndin gleymdi|Einhver telur ljósin í höfninni|Sérhver alda ber nafn sem er ekki þitt|Merkið barst áður en það var sent",
          "svaraðu ekki þegar vatnið talar|djúpið er ekki tómt — það hlustar|síðasta skipið er ekki enn farið",
          "Þögnin hefur púls hér",
        );
        L(
          "fi",
          "Vuorovesi muistaa sen, minkä ranta unohti|Joku laskee sataman valoja|Jokainen aalto kantaa nimeä, joka ei ole sinun|Signaali saapui ennen kuin se lähetettiin",
          "älä vastaa, kun vesi puhuu|syvyys ei ole tyhjä — se kuuntelee|viimeinen laiva ei ole vielä lähtenyt",
          "Hiljaisuudella on täällä syke",
        );
        L(
          "et",
          "Tõus mäletab seda, mida kallas unustas|Keegi loendab sadama tulesid|Iga laine kannab nime, mis pole sinu oma|Signaal saabus enne, kui see saadeti",
          "ära vasta, kui vesi räägib|sügavik pole tühi — see kuulab|viimane laev pole veel lahkunud",
          "Vaikusel on siin pulss",
        );
        L(
          "lv",
          "Paisums atceras to, ko krasts aizmirsa|Kāds skaita ostas gaismas|Katrs vilnis nes vārdu, kas nav tavs|Signāls ieradās, pirms tika nosūtīts",
          "neatbildi, kad ūdens runā|dziļums nav tukšs — tas klausās|pēdējais kuģis vēl nav aizgājis",
          "Klusumam šeit ir pulss",
        );
        L(
          "lt",
          "Potvynis prisimena tai, ką krantas pamiršo|Kažkas skaičiuoja uosto šviesas|Kiekviena banga neša vardą, kuris ne tavo|Signalas atkeliavo anksčiau, nei buvo išsiųstas",
          "neatsakyk, kai kalba vanduo|gelmė nėra tuščia — ji klausosi|paskutinis laivas dar neišplaukė",
          "Tyla čia turi pulsą",
        );
        L(
          "fr",
          "La marée se souvient de ce que le rivage a oublié|Quelqu'un compte les lumières du port|Chaque vague porte un nom qui n'est pas le tien|Le signal est arrivé avant d'être envoyé",
          "ne réponds pas quand l'eau parle|l'abîme n'est pas vide — il écoute|le dernier navire n'est pas encore parti",
          "Le silence a ici un pouls",
        );
        L(
          "es",
          "La marea recuerda lo que la orilla olvidó|Alguien cuenta las luces del puerto|Cada ola lleva un nombre que no es tuyo|La señal llegó antes de ser enviada",
          "no respondas cuando el agua habla|el abismo no está vacío — escucha|el último barco aún no ha partido",
          "El silencio tiene aquí un pulso",
        );
        L(
          "pt",
          "A maré lembra o que a margem esqueceu|Alguém conta as luzes do porto|Cada onda carrega um nome que não é teu|O sinal chegou antes de ser enviado",
          "não respondas quando a água fala|o abismo não está vazio — ele escuta|o último navio ainda não partiu",
          "O silêncio tem aqui um pulso",
        );
        L(
          "it",
          "La marea ricorda ciò che la riva ha dimenticato|Qualcuno conta le luci del porto|Ogni onda porta un nome che non è tuo|Il segnale è arrivato prima di essere inviato",
          "non rispondere quando l'acqua parla|l'abisso non è vuoto — ascolta|l'ultima nave non è ancora partita",
          "Il silenzio qui ha un battito",
        );
        L(
          "ro",
          "Fluxul își amintește ce a uitat țărmul|Cineva numără luminile portului|Fiecare val poartă un nume care nu e al tău|Semnalul a sosit înainte de a fi trimis",
          "nu răspunde când apa vorbește|adâncul nu e gol — ascultă|ultima corabie nu a plecat încă",
          "Tăcerea are aici puls",
        );
        L(
          "ca",
          "La marea recorda el que la riba va oblidar|Algú compta els llums del port|Cada onada porta un nom que no és teu|El senyal va arribar abans de ser enviat",
          "no responguis quan l'aigua parla|l'abisme no és buit — escolta|l'últim vaixell encara no ha salpat",
          "El silenci té aquí un pols",
        );
        L(
          "gl",

            g.addColorStop(0.7, "#120908");

            rg.addColorStop(0.4, "rgba(128,56,32,.14)");

            o.frequency.setValueAtTime(196, t);
            o.frequency.exponentialRampToValueAtTime(392, t + dur);
            og.gain.setValueAtTime(0, t);
            og.gain.linearRampToValueAtTime(0.012, t + dur * 0.85);
            og.gain.linearRampToValueAtTime(0, t + dur);
            o.connect(og);
            og.connect(fxBus);
            o.start(t);
            o.stop(t + dur + 0.3);
          }
          function riserLoop(ms) {
            later(() => {
              if (!on) return;
              riser(rnd(16, 24));
              riserLoop(rnd(40000, 75000));
            }, ms);
          }
          function fall(i) {
            if (!on || !ctx) return;
            const t = ctx.currentTime + 0.02,
              ts = t + 0.3,
              d = rnd(1.0, 1.35);
            const cr = ctx.createBufferSource();
            cr.buffer = pinkB;
            const chp = filt("highpass", 1500, 0.7),
              cg = ctx.createGain();
            cg.gain.setValueAtTime(0, t);
            cg.gain.linearRampToValueAtTime(0.12, t + 0.01);
            cg.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            cr.connect(chp);
            chp.connect(cg);
            cg.connect(fxBus);
            cr.start(t, Math.random() * 3);
            cr.stop(t + 0.2);
            const ws = ctx.createBufferSource();
            ws.buffer = pinkB;
            ws.loop = true;
            const bp = filt("bandpass", 2200, 1.1);
            bp.frequency.setValueAtTime(2200, ts);
            bp.frequency.exponentialRampToValueAtTime(140, ts + d);
            const wg = ctx.createGain(),
              pn = pan(rnd(-0.3, 0.3));
            wg.gain.setValueAtTime(0, ts);
            wg.gain.linearRampToValueAtTime(0.16, ts + d * 0.45);
            wg.gain.linearRampToValueAtTime(0, ts + d + 0.1);
            ws.connect(bp);
            bp.connect(wg);
            wg.connect(pn);
            pn.connect(fxBus);
            ws.start(ts, Math.random() * 3);
            ws.stop(ts + d + 0.2);
            const f0 = 520 * (1 - i * 0.07),
              o = ctx.createOscillator(),
              og = ctx.createGain();
            o.type = "triangle";
            o.frequency.setValueAtTime(f0, ts);
            o.frequency.exponentialRampToValueAtTime(f0 * 0.1, ts + d);
            og.gain.setValueAtTime(0, ts);
            og.gain.linearRampToValueAtTime(0.06, ts + 0.12);
            og.gain.linearRampToValueAtTime(0, ts + d);
            o.connect(og);
            og.connect(fxBus);
            o.start(ts);
            o.stop(ts + d + 0.1);
            const ti = ts + d,
              bo = ctx.createOscillator(),
              bg = ctx.createGain(),
              blp = filt("lowpass", 180, 0.7);
            bo.type = "sine";
            bo.frequency.setValueAtTime(90, ti);
            bo.frequency.exponentialRampToValueAtTime(32, ti + 0.6);
            bg.gain.setValueAtTime(0, ti);
            bg.gain.linearRampToValueAtTime(0.3, ti + 0.02);
            bg.gain.exponentialRampToValueAtTime(0.001, ti + 0.9);
            bo.connect(blp);
            blp.connect(bg);
            bg.connect(fxBus);
            bo.start(ti);
            bo.stop(ti + 1);
          }
          function voidMode(b) {
            voidOn = b;
            if (!ctx) return;
            const t = ctx.currentTime;
            oceanBus.gain.setTargetAtTime(b ? 0.12 : 1, t, b ? 1.2 : 2.5);
            droneBus.gain.setTargetAtTime(b ? 1.8 : 1, t, b ? 2 : 3);
            binBus.gain.setTargetAtTime(b ? 0.75 : 1, t, 2);
            if (b && on) riser(7);
          }
          async function toggle() {
            if (!AC) return false;
            if (!ctx) build();
            if (!on) {
              await ctx.resume();
              on = true;
              const t = ctx.currentTime;
              master.gain.cancelScheduledValues(t);
              master.gain.setTargetAtTime(0.8, t, 1.1);
              waveCycle();
              heart();
              beatDrift();
              tension();
              riserLoop(9000);
              if (voidOn) {
                oceanBus.gain.value = 0.12;
              }
            } else {
              on = false;
              timers.forEach(clearTimeout);
              timers.clear();
              master.gain.cancelScheduledValues(ctx.currentTime);
              master.gain.setTargetAtTime(0, ctx.currentTime, 0.35);
              setTimeout(() => {
                if (!on && ctx.state === "running") ctx.suspend();
              }, 1700);
            }
            return on;
          }
          return { toggle, fall, voidMode };
        })();

        const sndBtn = $("#snd");
        sndBtn.addEventListener("click", () => {
          Snd.toggle()
            .then((v) => {
              sndBtn.classList.toggle("on", !!v);
              sndBtn.setAttribute("aria-pressed", v ? "true" : "false");
            })
            .catch(() => {});
        });

        /* ================= COLLAPSE SEQUENCE ================= */
        const Shake = {
          amp: 0,
          on: false,
          start() {
            if (this.on) return;
            this.on = true;
            state.shake = true;
            raf(this.loop);
          },
          stop() {
            this.on = false;
            state.shake = false;
            const T = Title.T;
            T.dx = T.dy = T.sk = 0;
            T.sx = T.sy = 1;
            T.ga = 0;
            T.gx = 0;
            Title.S.forEach((s, i) => {
              s.ox = s.oy = 0;
              if (!s.falling && !s.gone) s.fr = 0;
              Title.applyL(i);
            });
            Title.render();
          },
          loop(now) {
            if (!Shake.on) return;
            const a = Shake.amp,
              T = Title.T,
              n = (k, sp) => noise(k + now * (sp || 0.03));
            T.dx = n(1) * 5 * a;
            T.dy = n(2) * 3.2 * a;
            T.sk = n(3) * 1.6 * a;
            T.sx = 1 + n(4) * 0.008 * a;
            T.sy = 1 + n(5) * 0.01 * a;
            T.gx = Math.abs(n(6)) * 5 * a;
            T.ga = 0.5 * a;
            Title.S.forEach((s, i) => {
              if (!s.gone && !s.falling) {
                s.ox = (n(10 + i * 3, 0.05) * (3 + 6 * a) * a) / T.kx;
                s.oy = (n(40 + i * 3, 0.05) * (2 + 5 * a) * a) / T.ky;
                s.fr = n(70 + i, 0.04) * 1.6 * a;
              }
              Title.applyL(i);
            });
            Title.render();
            raf(Shake.loop);
          },
        };

        async function drop(i, h0) {
          const s = Title.S[i],
            T = Title.T;
          s.falling = true;
          Snd.fall(i);
          const sd = rnd(0, 100);
          await tween(rint(260, 380), (u) => {
            s.fy = (noise(sd + u * 14) * 5 * u) / T.ky;
            s.fr = noise(sd + 9 + u * 12) * 2.4 * u;
            Title.applyL(i);
          });
          const D = (innerHeight * 0.5 + h0 * T.ky * 0.55 + 140) / T.ky,
            dur = rnd(1050, 1400),
            rot = (Math.random() < 0.5 ? -1 : 1) * rnd(6, 16),
            dx = rnd(-28, 28);
          await tween(dur, (u) => {
            const p = Math.pow(u, 2.15);
            s.fy = D * p;
            s.fx = dx * u * u;
            s.fr = rot * u * u;
            Title.applyL(i);
          });
          s.gone = true;
          s.falling = false;
          Title.letters[i].style.visibility = "hidden";
        }

        async function recover() {
          const el = Title.el;
          el.style.transition = "none";
          el.style.opacity = "0";
          Title.reset();
          void el.offsetWidth;
          root.classList.remove("void");
          Waves.setActive(true);
          Snd.voidMode(false);
          Loader.reset();
          await sleep(40);
          el.style.transition = "opacity 2.8s ease 1.2s,color 2.4s ease";
          el.style.opacity = "1";
          setTimeout(() => Msgs.start(), 2200);
          await sleep(4400);
          el.style.transition = "";
          el.style.opacity = "";
          Title.measure();
          state.void = false;
        }

        async function collapse() {
          if (state.void) return;
          state.void = true;
          while (state.fx || Loader.busy()) await sleep(80);
          Msgs.stop();
          Loader.pause();
          Snd.voidMode(true);
          root.classList.add("void");
          setTimeout(() => Waves.setActive(false), 3200);
          const h0 = Title.el.offsetHeight,
            w0 = Title.el.offsetWidth;
          const kx = clamp((innerWidth * 0.94) / w0, 1, 12),
            ky = clamp(
              Math.min(kx * 2.4, (innerHeight * 0.9) / h0),
              kx * 0.9,
              24,
            );
          await sleep(700);
          await tween(3400, (u) => {
            const e = E.io(u);
            Title.T.kx = lerp(1, kx, e);
            Title.T.ky = lerp(1, ky, e);
            Title.render();
          });
          Shake.amp = 0.04;
          Shake.start();
          await tween(rnd(6500, 8500), (u) => {
            Shake.amp = 0.04 + 0.96 * Math.pow(u, 1.7);
          });
          const jobs = [];
          for (let i = 5; i >= 0; i--) {
            jobs.push(drop(i, h0));
            Shake.amp = 1 + (5 - i) * 0.12;
            await sleep(rnd(850, 1150));
          }
          await Promise.all(jobs);
          await tween(500, (u) => {
            Shake.amp = Math.max(0, 1.6 * (1 - u));
          });
          Shake.stop();
          await sleep(rnd(3000, 5200));
          await recover();
        }

        function schedule(ms) {
          setTimeout(async () => {
            if (document.hidden || state.void) {
              schedule(8000);
              return;
            }
            try {
              await collapse();
            } catch (_) {
              state.void = false;
              root.classList.remove("void");
            }
            schedule(rnd(120000, 600000));
          }, ms);
        }

        /* ================= INIT ================= */
        (function init() {
          const m = () => Title.measure();
          raf(m);
          window.addEventListener("load", m);
          if (document.fonts && document.fonts.ready)
            document.fonts.ready.then(m);
          let rt = 0;
          window.addEventListener("resize", () => {
            clearTimeout(rt);
            rt = setTimeout(() => {
              Waves.resize();
              m();
            }, 150);
          });
          scramble($("#msg"), "Aligning the tide tables…", 900);
          setTimeout(() => Msgs.start(), 1200);
          schedule(location.hash === "#void" ? 3500 : rnd(120000, 600000));
        })();
      })();
    </script>
  </body>
</html>
