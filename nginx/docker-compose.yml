name: nginx

networks:
  localnet:
    external: true

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    networks:
      localnet:
        ipv4_address: 172.20.0.20
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - ./data/:/data/
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf

    logging:
      driver: "local"
      options:
        max-size: "100m"
