name: uptime-kuma

networks:
  localnet:
    external: true

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
    networks:
      localnet:
        ipv4_address: 172.20.0.50
    volumes:
      - ./data:/app/data
    environment:
      - TZ=UTC

    logging:
      driver: "local"
      options:
        max-size: "100m"

