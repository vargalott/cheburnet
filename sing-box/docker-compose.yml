name: sing-box

services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box
    restart: always
    networks:
      localnet:
        ipv4_address: 172.20.0.10
    # ports:
    #   - 443:443
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - ./sing-box:/etc/sing-box/
    command: -D /var/lib/sing-box -C /etc/sing-box/ run

    logging:
      driver: "local"
      options:
        max-size: "100m"

networks:
  localnet:
    external: true
