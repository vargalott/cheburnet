name: vaultwarden

networks:
  localnet:
    external: true

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    networks:
      localnet:
        ipv4_address: 172.20.0.40
    volumes:
      - type: bind
        source: ./data
        target: /data
    environment:
      DOMAIN: https://DOMAIN/vault
      SIGNUPS_ALLOWED: false
      INVITATIONS_ALLOWED: false
      EXTENDED_LOGGING: true
      SHOW_PASSWORD_HINT: false
      LOG_LEVEL: warn

    logging:
      driver: "local"
      options:
        max-size: "100m"
