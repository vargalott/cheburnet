name: xray

networks:
  localnet:
    external: true

services:
  xray:
    image: ghcr.io/xtls/xray-core
    container_name: xray
    restart: always
    user: root
    networks:
      localnet:
        ipv4_address: 172.20.0.10
    ports:
      - 443:443
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - type: bind
        source: ./config.json
        target: /usr/local/etc/xray/config.json
    command: run -c /usr/local/etc/xray/config.json

    logging:
      driver: "local"
      options:
        max-size: "100m"
