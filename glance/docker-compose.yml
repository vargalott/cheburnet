name: glance

networks:
  localnet:
    external: true

services:
  glance:
    image: glanceapp/glance
    container_name: glance
    restart: always
    networks:
      localnet:
        ipv4_address: 172.20.0.30
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging:
      driver: "local"
      options:
        max-size: "100m"
